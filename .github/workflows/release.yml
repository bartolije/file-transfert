name: Release

# Pousser un tag vX.Y.Z (identique à la version de package.json) construit, signe et publie l'appli.
# Lancement manuel (workflow_dispatch) : essai à blanc, construction + signature + démarrage, sans rien publier.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  release:
    runs-on: macos-latest # Apple Silicon
    permissions:
      contents: write # création de la release
      id-token: write # attestation de provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Le tag correspond à package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run app
      - name: Signature macOS (certificat stable, pour que le Trousseau reconnaisse l'appli d'une version à l'autre)
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: scripts/sign-app.sh "dist/File Transfert-darwin-arm64/File Transfert.app"
      - name: L'appli signée démarre
        run: |
          "dist/File Transfert-darwin-arm64/File Transfert.app/Contents/MacOS/File Transfert" &
          PID=$!
          sleep 10
          kill -0 "$PID"
          kill "$PID"
      - name: Archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="File-Transfert-$VERSION-mac-arm64.zip"
          ditto -c -k --keepParent "dist/File Transfert-darwin-arm64/File Transfert.app" "$ZIP"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
      - name: Signature pour la mise à jour automatique
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: node scripts/sign-release.js "$ZIP" "$VERSION" arm64
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ZIP }}
      - name: Publication
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sig" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
